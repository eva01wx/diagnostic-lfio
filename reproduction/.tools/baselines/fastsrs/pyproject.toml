[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsrs"
dynamic = ["version"]
description = "Fast Rashomon Sets of Sparse Rule Sets: learn short, accurate rule sets for binary classification with simulated annealing"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cristina Molero-Río", email = "mmolero@us.es" },
    { name = "Boxuan Li", email = "bl3011@columbia.edu" },
    { name = "Tong Wang" },
    { name = "Cynthia Rudin" },
]
keywords = ["rule sets", "interpretable machine learning", "Rashomon set", "sparse models", "simulated annealing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "joblib>=1.0",
    "pyfim>=6.28",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/mmolerous/FastSRS"
Repository = "https://github.com/mmolerous/FastSRS"
Issues = "https://github.com/mmolerous/FastSRS/issues"
Paper = "https://doi.org/10.1007/s10994-026-07108-9"

[tool.setuptools.dynamic]
version = { attr = "fastsrs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
